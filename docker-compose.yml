version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: plm_postgres
    environment:
      POSTGRES_DB: plm_db
      POSTGRES_USER: plm_user
      POSTGRES_PASSWORD: plm_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plm_user -d plm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: plm_server
    environment:
      PORT: 5000
      DATABASE_URL: postgres://plm_user:plm_password@postgres:5432/plm_db
      JWT_SECRET: plm_super_secret_jwt_key_2026
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build: ./client
    container_name: plm_client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
